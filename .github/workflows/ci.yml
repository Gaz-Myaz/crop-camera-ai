name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        # Only what the hardware-free checks need: the per-plant regression
        # (numpy, cv2 in one path) and importing the shared camera layer.
        # ultralytics/openai are deliberately absent -- they are heavy and
        # lazy-imported inside the scripts that need them.
        run: python -m pip install numpy opencv-python-headless

      - name: Syntax-check every script
        run: python -m compileall -q common ndvi training experiments

      - name: Import-check the shared layer
        run: >
          python -c "import sys; sys.path.insert(0, 'common');
          import camera_utils, farm_ai_actions, farm_camera_detect,
          farm_camera_agent, plant_anomaly_agent; print('shared layer imports OK')"

      - name: Per-plant NDVI regression (no camera, model or dataset)
        run: python training/per_plant_ndvi.py --demo
